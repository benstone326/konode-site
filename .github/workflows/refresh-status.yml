# Refreshes the version numbers on roadmap.html from Firefox Add-ons, the Chrome
# extension update endpoint and the GitHub releases API, then pushes the result —
# which redeploys the live site.
#
# Nothing here writes prose: scripts/sync-status.mjs only rewrites the fenced
# strip, and fails loudly rather than guessing if the fence has gone missing or a
# store answers with something that is not a version. The job commits only when
# something actually moved, so a quiet day leaves no trace and triggers no deploy.
#
# 06:17 UTC, off the hour because scheduled runs at :00 queue behind everyone else's.
name: Refresh store status

on:
  workflow_dispatch:
  # The same knock upstream-drift.yml listens for, sent by the extension repo. That
  # one only ever files an issue, by design, so until this was here the fast path
  # could not move a version number: a release went out and the strip kept saying
  # the old one until the next scheduled run, which in practice lands four to six
  # hours after the time below rather than at it.
  #
  # Safe to fire often. The job rewrites the fence only when a store answers with a
  # version that differs from the one on the page, and commits only when something
  # actually moved, so an extra run on an ordinary docs push leaves no trace.
  #
  # It cannot run AHEAD of the stores, which is the limit worth remembering: the
  # numbers are read from Firefox Add-ons and the Chrome update endpoint, so this
  # reports what they serve, not what was uploaded. AMO takes minutes, the Chrome
  # Web Store takes days, and the schedule below is what eventually catches it.
  repository_dispatch:
    types: [upstream-docs-changed]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-status

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The last step in this job pushes. That works because checkout leaves the
          # token in the local git config, so it is stated rather than inherited from
          # a default that could change under us.
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rewrite the status paragraph
        run: node scripts/sync-status.mjs

      - name: Commit only if something moved
        run: |
          git config user.name "konode-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json roadmap.html
          if git diff --cached --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          git commit -m "chore(site): store versions refreshed"
          git push
